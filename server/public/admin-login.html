<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Admin Login — Erlbrew Café</title>
<link rel="icon" type="image/jpeg" href="/uploads/about-467a615191f3.jpg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased}
body{
  background:#F4EFE6;
  color:#181714;
  font-family:'Inter',sans-serif;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* ── Card ── */
.login-card{
  background:#F0EBE2;
  border:1px solid rgba(24,23,20,.07);
  border-radius:16px;
  padding:48px 40px 40px;
  width:100%;
  max-width:380px;
  box-shadow:0 1px 3px rgba(24,23,20,.04);
}

.brand-name{
  font-family:'Cormorant Garamond',serif;
  font-size:28px;
  font-weight:400;
  letter-spacing:-.3px;
  color:#181714;
  text-align:center;
}
.brand-sub{
  font-size:9px;
  font-weight:400;
  letter-spacing:.2em;
  text-transform:uppercase;
  color:rgba(24,23,20,.35);
  text-align:center;
  margin-top:4px;
}
.brand-line{
  width:32px;
  height:1px;
  background:rgba(184,147,90,.5);
  margin:20px auto 28px;
}

/* ── Form ── */
.form-group{margin-bottom:18px}
.form-group label{
  display:block;
  font-size:11px;
  font-weight:500;
  letter-spacing:.05em;
  color:rgba(24,23,20,.55);
  margin-bottom:6px;
}
.form-group input{
  width:100%;
  padding:10px 14px;
  font-size:14px;
  font-family:'Inter',sans-serif;
  background:#F4EFE6;
  border:1px solid rgba(24,23,20,.1);
  border-radius:8px;
  color:#181714;
  outline:none;
  transition:border-color .2s,box-shadow .2s;
}
.form-group input:focus{
  border-color:#B8935A;
  box-shadow:0 0 0 3px rgba(184,147,90,.12);
}
.form-group input::placeholder{color:rgba(24,23,20,.22)}

/* ── Button ── */
.btn-login{
  width:100%;
  padding:11px;
  font-size:13px;
  font-weight:500;
  font-family:'Inter',sans-serif;
  letter-spacing:.04em;
  background:#181714;
  color:#F4EFE6;
  border:none;
  border-radius:8px;
  cursor:pointer;
  transition:background .2s,transform .1s;
  margin-top:8px;
}
.btn-login:hover{background:#2a2a26}
.btn-login:active{transform:scale(.98)}

/* ── Error ── */
.error-msg{
  display:none;
  font-size:12px;
  color:#c0392b;
  text-align:center;
  margin-top:14px;
  padding:8px 12px;
  background:rgba(192,57,43,.06);
  border-radius:6px;
}
.error-msg.show{display:block}

/* ── Loading ── */
.btn-login.loading{pointer-events:none;opacity:.6}
.spinner{display:none;vertical-align:middle;margin-left:6px}
.btn-login.loading .spinner{display:inline-block}
</style>
</head>
<body>

<div class="login-card">
  <div class="brand-name">Erlbrew</div>
  <div class="brand-sub">Admin Panel</div>
  <div class="brand-line"></div>

  <form id="loginForm" autocomplete="off">
    <div class="form-group">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" placeholder="admin" required/>
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="••••••••" required/>
    </div>
    <button type="submit" class="btn-login" id="loginBtn">
      Sign In
      <span class="spinner">⌛</span>
    </button>
    <div class="error-msg" id="errorMsg"></div>
  </form>
</div>

<script>
const form = document.getElementById('loginForm');
const btn = document.getElementById('loginBtn');
const error = document.getElementById('errorMsg');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  error.classList.remove('show');
  btn.classList.add('loading');

  const username = document.getElementById('username').value;
  const password = document.getElementById('password').value;

  try {
    const res = await fetch('/api/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password }),
    });

    const data = await res.json();

    if (res.ok && data.success) {
      window.location.href = '/admin';
    } else {
      error.textContent = data.message || 'Invalid credentials';
      error.classList.add('show');
    }
  } catch (err) {
    error.textContent = 'Connection error. Please try again.';
    error.classList.add('show');
  } finally {
    btn.classList.remove('loading');
  }
});
</script>

</body>
</html>
